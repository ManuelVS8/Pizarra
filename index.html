<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#1F4036">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Pizarra">
<meta name="description" content="Pizarra digital para PDI y paneles interactivos: escribe sobre páginas, PDF e imágenes.">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icono-192.png">
<title>Pizarra Siurot</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%231F4036'/%3E%3Cpath d='M14 44c6-14 12-22 16-22s2 12 6 12 6-10 14-16' fill='none' stroke='%23F3F5F1' stroke-width='5' stroke-linecap='round'/%3E%3Crect x='12' y='50' width='40' height='4' rx='2' fill='%23F5B700'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Andika:wght@400;700&family=Atkinson+Hyperlegible:wght@400;700&family=Playwrite+ES&display=swap" rel="stylesheet">
<style>
:root{
  --pz:#1F4036; --pz-2:#2A5447; --pz-3:#3A6A59; --pz-ink:#152C25;
  --tiza:#F3F5F1; --tiza-2:#E4E9E5; --tiza-3:#CCD6D0;
  --lapiz:#F5B700; --lapiz-2:#FFD04D;
  --grafito:#1C2723; --grafito-2:#4A5A54; --grafito-3:#7C8B85;
  --mesa:#B9C6BF; --rojo:#D7372F; --azul:#1E63D6;
  --ui:"Atkinson Hyperlegible",system-ui,"Segoe UI",Roboto,sans-serif;
  --ligada:"Playwrite ES","Segoe Script",cursive;
  --btn:56px; --gap:6px; --r:18px;
  --shadow:0 10px 30px rgba(10,30,24,.28),0 2px 6px rgba(10,30,24,.18);
}
body.big{--btn:68px}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;background:var(--mesa);color:var(--grafito);font-family:var(--ui);font-size:16px;overscroll-behavior:none;-webkit-user-select:none;user-select:none;touch-action:none}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;touch-action:manipulation}
input,textarea,select{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--lapiz);outline-offset:2px}
svg.i{width:26px;height:26px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none;pointer-events:none}
.hidden{display:none!important}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* ===== Pantalla inicial ===== */
#home{position:fixed;inset:0;display:flex;flex-direction:column;background:var(--tiza);overflow:auto;touch-action:pan-y}
.hero{background:var(--pz);color:var(--tiza);padding:36px clamp(20px,5vw,64px) 30px;position:relative}
.hero::after{content:"";position:absolute;left:0;right:0;bottom:0;height:10px;background:linear-gradient(90deg,var(--lapiz) 0 18%,transparent 18%)}
.brand{display:flex;align-items:center;gap:clamp(14px,2.5vw,26px)}
.brand>div{display:flex;align-items:baseline;gap:6px 18px;flex-wrap:wrap}
.brand .logo{width:clamp(76px,9vw,112px);height:auto;flex:none;border-radius:12%;box-shadow:0 6px 18px rgba(0,0,0,.28)}
.brand h1{font-family:var(--ligada);font-weight:400;font-size:clamp(44px,7vw,78px);line-height:1.5;margin:0;letter-spacing:.01em}
.brand span{font-size:18px;opacity:.75}
.hero-actions{display:flex;flex-wrap:wrap;gap:12px;margin-top:18px}
.hbtn{display:inline-flex;align-items:center;gap:10px;min-height:56px;padding:0 22px;border-radius:16px;background:var(--pz-2);color:var(--tiza);font-weight:700;font-size:17px}
.hbtn:hover{background:var(--pz-3)}
.hbtn.main{background:var(--lapiz);color:var(--pz-ink)}
.hbtn.main:hover{background:var(--lapiz-2)}
.lib{padding:28px clamp(20px,5vw,64px) 60px;flex:1}
.lib-sec{margin-bottom:34px}
.lib-head{display:flex;align-items:center;gap:12px;margin-bottom:14px;flex-wrap:wrap}
.lib-head h2{font-size:21px;margin:0;font-weight:700}
.lib-head .sub{color:var(--grafito-3);font-size:15px}
.lib-head .sp{flex:1}
.lbtn{display:inline-flex;align-items:center;gap:8px;min-height:44px;padding:0 16px;border-radius:12px;background:var(--tiza-2);font-weight:700;font-size:15px}
.lbtn:hover{background:var(--tiza-3)}
.lbtn svg.i{width:20px;height:20px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:20px}
.card{position:relative;background:#fff;border-radius:14px;overflow:hidden;box-shadow:0 1px 0 var(--tiza-3),0 4px 14px rgba(20,50,40,.08);text-align:left;display:flex;flex-direction:column}
.card:hover{box-shadow:0 1px 0 var(--tiza-3),0 8px 24px rgba(20,50,40,.16)}
.card .th{aspect-ratio:16/9;background:#fff center top/cover no-repeat;border-bottom:1px solid var(--tiza-2)}
.card .meta{padding:12px 48px 14px 14px;text-align:left}
.card .nm{font-weight:700;font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card .dt{font-size:13px;color:var(--grafito-3);margin-top:3px}
.card .more{position:absolute;right:6px;bottom:8px;width:40px;height:40px;border-radius:10px;display:grid;place-items:center;color:var(--grafito-2)}
.card .more:hover{background:var(--tiza-2)}
.card .badge{position:absolute;left:10px;top:10px;background:var(--pz);color:var(--tiza);font-size:12px;padding:3px 8px;border-radius:8px}
.empty{border:2px dashed var(--tiza-3);border-radius:16px;padding:34px;color:var(--grafito-2);max-width:640px;line-height:1.5}
.empty b{display:block;font-size:18px;color:var(--grafito);margin-bottom:4px}
.foot{padding:0 clamp(20px,5vw,64px) 24px;color:var(--grafito-3);font-size:13px}

/* ===== Pizarra ===== */
#board{position:fixed;inset:0;overflow:hidden}
#stage{position:absolute;inset:0;touch-action:none;cursor:crosshair}
#stage canvas{position:absolute;left:0;top:0;pointer-events:none}
#stage.t-select{cursor:default}#stage.t-hand{cursor:grab}#stage.t-text{cursor:text}
#overlay{position:absolute;inset:0;pointer-events:none}
#overlay>*{pointer-events:auto}

.pill{position:absolute;display:flex;align-items:center;gap:var(--gap);padding:var(--gap);background:var(--pz);color:var(--tiza);border-radius:var(--r);box-shadow:var(--shadow);z-index:20}
.tb{width:var(--btn);height:var(--btn);border-radius:14px;display:grid;place-items:center;position:relative;color:var(--tiza);flex:none}
.tb:hover{background:var(--pz-2)}
.tb.on{background:var(--lapiz);color:var(--pz-ink)}
.tb.on::after{content:"";position:absolute;right:5px;bottom:5px;border:4px solid transparent;border-right-color:currentColor;border-bottom-color:currentColor;opacity:.55}
.tb[disabled]{opacity:.35;pointer-events:none}
.tb.sm{width:calc(var(--btn) - 12px);height:calc(var(--btn) - 12px)}
.sep{width:1px;align-self:stretch;margin:6px 2px;background:rgba(255,255,255,.14);flex:none}
.sw{width:var(--btn);height:var(--btn);border-radius:14px;display:grid;place-items:center;flex:none}
.sw i{display:block;width:30px;height:30px;border-radius:50%;box-shadow:inset 0 0 0 2px rgba(255,255,255,.35)}
.sw:hover{background:var(--pz-2)}
.sw.on i{box-shadow:0 0 0 3px var(--pz),0 0 0 6px var(--lapiz)}
.sw.pal i{background:conic-gradient(#e53935,#fb8c00,#fdd835,#43a047,#1e88e5,#8e24aa,#e53935)}
.sw.pal b{position:absolute;width:12px;height:12px;border-radius:50%;border:2px solid var(--pz)}

#dock{left:50%;bottom:calc(12px + env(safe-area-inset-bottom));transform:translateX(-50%);max-width:calc(100vw - 20px);overflow-x:auto;scrollbar-width:none;transition:opacity .18s}
#dock::-webkit-scrollbar{display:none}
body.dock-v #dock{display:grid;grid-auto-flow:column;grid-auto-columns:var(--btn);grid-auto-rows:var(--btn);bottom:auto;top:50%;transform:translateY(-50%);max-width:none;overflow:visible}
body.dock-left #dock{left:12px}
body.dock-right #dock{left:auto;right:12px}
body.dock-v #dock .sep{display:none}
#pageLbl{min-width:58px;height:var(--btn);border-radius:14px;font-weight:700;font-size:16px;white-space:nowrap;padding:0 6px;color:var(--tiza);font-variant-numeric:tabular-nums;flex:none}
#pageLbl:hover{background:var(--pz-2)}
body.dock-v #pageLbl{min-width:0;width:var(--btn);padding:0;font-size:14px}
#bMenu .dot{position:absolute;right:10px;top:10px;width:10px;height:10px;border-radius:50%;box-shadow:0 0 0 2px var(--pz);display:none}
#bMenu.dirty .dot{display:block;background:var(--lapiz)}
#bMenu.err .dot{display:block;background:var(--rojo)}
#bColor i{width:32px;height:32px;box-shadow:inset 0 0 0 2px rgba(255,255,255,.4),0 0 0 2px var(--pz-3)}
#bDockMin .cdot{display:none;position:absolute;right:8px;bottom:8px;width:14px;height:14px;border-radius:50%;box-shadow:0 0 0 2px var(--pz-ink)}
body.dock-min #dock{display:flex;overflow:visible;flex-direction:row}
body.dock-min.dock-v #dock{flex-direction:column}
body.dock-min #dock>*:not(.keep){display:none}
body.dock-min.multipage #dock>.mini{display:grid}
body.dock-min #bDockMin{background:var(--lapiz);color:var(--pz-ink)}
body.dock-min #bDockMin .cdot{display:block}
body.ghost #dock,body.ghost #selbar,body.ghost #zoomChip{opacity:.08;pointer-events:none}
#zoomChip{position:absolute;top:calc(12px + env(safe-area-inset-top));left:50%;transform:translateX(-50%);z-index:22;display:flex;align-items:center;gap:8px;padding:5px 5px 5px 14px;background:var(--pz);color:var(--tiza);border-radius:14px;box-shadow:var(--shadow);font-weight:700;font-variant-numeric:tabular-nums;transition:opacity .18s}
#zoomChip button{min-height:40px;padding:0 12px;border-radius:10px;background:var(--pz-2);font-weight:700;font-size:14px}
#zoomChip button:hover{background:var(--pz-3)}

/* Popovers */
.pop{position:absolute;z-index:40;background:var(--pz);color:var(--tiza);border-radius:20px;box-shadow:var(--shadow);padding:16px;min-width:260px;max-width:min(440px,calc(100vw - 20px));max-height:calc(100vh - 30px);overflow:auto;animation:popIn .14s ease-out;touch-action:pan-y}
@keyframes popIn{from{opacity:0;transform:translateY(6px) scale(.98)}to{opacity:1;transform:none}}
.pop.wide{width:min(520px,calc(100vw - 20px));max-width:none}
.mhead{display:flex;align-items:stretch;gap:8px;margin-bottom:14px}
.mname{flex:1;min-width:0;text-align:left;padding:10px 12px;border-radius:14px;background:var(--pz-2)}
.mname:hover{background:var(--pz-3)}
.mname b{display:block;font-size:17px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mname small{display:flex;align-items:center;gap:6px;font-size:13px;opacity:.75;margin-top:3px}
.mname small i{width:8px;height:8px;border-radius:50%;background:#7bd389;flex:none}
.mname small i.dirty{background:var(--lapiz)}.mname small i.err{background:var(--rojo)}
.zrow{display:flex;align-items:center;gap:6px;margin-top:12px}
.zrow output{min-width:64px;text-align:center;font-weight:700;font-variant-numeric:tabular-nums}
.grid-btns.g5{grid-template-columns:repeat(auto-fill,minmax(88px,1fr))}
.g5 .gbtn{min-height:74px;font-size:13px;line-height:1.15}
.pop h3{margin:0 0 10px;font-size:15px;font-weight:700;opacity:.8}
.pop h3:not(:first-child){margin-top:16px}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.chip{min-height:48px;padding:0 14px;border-radius:12px;background:var(--pz-2);display:inline-flex;align-items:center;gap:8px;font-weight:700;font-size:15px}
.chip:hover{background:var(--pz-3)}
.chip.on{background:var(--lapiz);color:var(--pz-ink)}
.chip svg.i{width:22px;height:22px}
.chip.ic{width:52px;padding:0;justify-content:center}
.colors{display:grid;grid-template-columns:repeat(6,48px);gap:8px}
.colors button{width:48px;height:48px;border-radius:50%;box-shadow:inset 0 0 0 2px rgba(255,255,255,.25)}
.colors button.on{box-shadow:0 0 0 3px var(--pz),0 0 0 6px var(--lapiz)}
.colors label{width:48px;height:48px;border-radius:50%;display:grid;place-items:center;background:var(--pz-2);cursor:pointer;position:relative;overflow:hidden}
.colors label input{position:absolute;opacity:0;inset:0;width:100%;height:100%;cursor:pointer}
.widths{display:flex;gap:8px}
.widths button{width:52px;height:52px;border-radius:12px;background:var(--pz-2);display:grid;place-items:center}
.widths button.on{background:var(--lapiz)}
.widths button i{display:block;border-radius:50%;background:var(--tiza)}
.widths button.on i{background:var(--pz-ink)}
.range{display:flex;align-items:center;gap:12px;width:100%}
.range input{flex:1;accent-color:var(--lapiz);height:36px}
.range output{min-width:44px;text-align:right;font-weight:700}
.hint{font-size:13px;opacity:.7;line-height:1.4;margin-top:10px;max-width:360px}
.toggle{display:flex;align-items:center;justify-content:space-between;gap:14px;min-height:52px;width:100%;padding:6px 12px;border-radius:12px;background:var(--pz-2);text-align:left;font-weight:700;font-size:15px}
.toggle+.toggle{margin-top:8px}
.toggle small{display:block;font-weight:400;opacity:.7;font-size:13px;margin-top:2px}
.toggle .sw2{width:48px;height:28px;border-radius:14px;background:rgba(255,255,255,.2);position:relative;flex:none;transition:background .15s}
.toggle .sw2::after{content:"";position:absolute;left:3px;top:3px;width:22px;height:22px;border-radius:50%;background:var(--tiza);transition:transform .15s}
.toggle.on .sw2{background:var(--lapiz)}
.toggle.on .sw2::after{transform:translateX(20px);background:var(--pz-ink)}
.grid-btns{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.gbtn{min-height:84px;border-radius:14px;background:var(--pz-2);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;font-size:14px;font-weight:700;padding:8px;text-align:center}
.gbtn:hover{background:var(--pz-3)}
.gbtn.on{background:var(--lapiz);color:var(--pz-ink)}
.bgs{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.bgs button{aspect-ratio:4/3;border-radius:10px;background:#fff center/cover;box-shadow:inset 0 0 0 1px rgba(0,0,0,.15);position:relative}
.bgs button.on{box-shadow:0 0 0 3px var(--pz),0 0 0 6px var(--lapiz)}
.bgs button span{position:absolute;left:-4px;right:-4px;bottom:-20px;font-size:12px;color:var(--tiza);opacity:.85;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-align:center}
.bgs{row-gap:28px;margin-bottom:12px}

/* Barra de selección */
#selbar{position:absolute;z-index:30;display:flex;gap:4px;padding:5px;background:var(--pz);border-radius:16px;box-shadow:var(--shadow);color:var(--tiza)}
#selbar .tb{width:48px;height:48px}
#selbar .tb.on::after{display:none}

/* Editor de texto */
#textEd{position:absolute;z-index:25;background:transparent;border:2px dashed var(--azul);border-radius:4px;outline:0;resize:none;overflow:hidden;padding:0;margin:0;white-space:pre;line-height:1.25;-webkit-user-select:text;user-select:text;touch-action:auto;min-width:40px}

/* Panel de páginas */
#pagesPanel{position:absolute;right:0;top:0;bottom:0;width:250px;z-index:35;background:var(--pz);color:var(--tiza);box-shadow:var(--shadow);display:flex;flex-direction:column;animation:slideIn .16s ease-out}
body.dock-right #pagesPanel{right:auto;left:0}
@keyframes slideIn{from{transform:translateX(30px);opacity:0}to{transform:none;opacity:1}}
.pp-head{display:flex;align-items:center;justify-content:space-between;padding:12px 10px 8px 18px;font-weight:700;font-size:17px}
.pp-list{flex:1;overflow:auto;padding:6px 18px 16px;display:flex;flex-direction:column;gap:14px;touch-action:pan-y}
.pthumb{position:relative;border-radius:10px;background:#fff center/contain no-repeat;box-shadow:0 0 0 1px rgba(0,0,0,.2);cursor:pointer;flex:none}
.pthumb.on{box-shadow:0 0 0 3px var(--pz),0 0 0 6px var(--lapiz)}
.pthumb b{position:absolute;left:-12px;top:-8px;min-width:26px;height:26px;border-radius:13px;background:var(--pz-3);display:grid;place-items:center;font-size:13px;padding:0 6px}
.pthumb.drag{opacity:.5}
.pp-foot{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;padding:10px;border-top:1px solid rgba(255,255,255,.1)}
.pp-foot .gbtn{min-height:66px;font-size:12px}

/* Ventanas flotantes */
.win{position:absolute;z-index:31;background:var(--pz);color:var(--tiza);border-radius:20px;box-shadow:var(--shadow);min-width:240px;touch-action:none;display:flex;flex-direction:column}
.win-h{display:flex;align-items:center;gap:8px;padding:8px 8px 4px 16px;cursor:move;font-weight:700}
.win-h span{flex:1;font-size:15px;opacity:.85}
.win-b{padding:6px 16px 16px}
.timer-d{font-size:clamp(56px,9vw,110px);font-weight:700;text-align:center;font-variant-numeric:tabular-nums;line-height:1.1;padding:8px 0;letter-spacing:.02em}
.timer-d.end{color:var(--lapiz);animation:blink .6s steps(2) infinite}
@keyframes blink{50%{opacity:.25}}
.dice{display:flex;gap:16px;justify-content:center;padding:10px 0 16px;flex-wrap:wrap}
.die{width:110px;height:110px;border-radius:22px;background:var(--tiza);display:grid;grid-template:repeat(3,1fr)/repeat(3,1fr);padding:14px;box-shadow:inset 0 -6px 0 var(--tiza-3)}
.die i{width:22px;height:22px;border-radius:50%;background:var(--pz-ink);place-self:center;visibility:hidden}
.die.roll{animation:roll .5s ease-out}
@keyframes roll{0%{transform:rotate(-200deg) scale(.6)}70%{transform:rotate(15deg) scale(1.05)}100%{transform:none}}
.pick-name{font-size:clamp(36px,6vw,72px);font-weight:700;text-align:center;min-height:1.4em;padding:10px 0;word-break:break-word}
.pick-name.done{color:var(--lapiz)}
.win textarea{width:100%;min-height:120px;border-radius:12px;border:0;padding:10px;background:var(--pz-2);color:var(--tiza);resize:vertical;-webkit-user-select:text;user-select:text;touch-action:auto}
.win video{display:block;width:100%;max-height:60vh;border-radius:12px;background:#000}
.win select{background:var(--pz-2);border:0;border-radius:10px;min-height:44px;padding:0 10px;color:var(--tiza);max-width:100%}

/* Cortina y foco */
#curtain{position:absolute;z-index:15;background:var(--pz-ink) repeating-linear-gradient(90deg,rgba(255,255,255,.03) 0 26px,rgba(0,0,0,.08) 26px 52px);touch-action:none;box-shadow:0 0 0 1px rgba(255,255,255,.15)}
.ch{position:absolute;display:grid;place-items:center;color:var(--tiza)}
.ch::before{content:"";background:var(--lapiz);border-radius:6px}
.ch.t,.ch.b{left:0;right:0;height:44px;cursor:ns-resize}.ch.t{top:0}.ch.b{bottom:0}
.ch.l,.ch.r{top:0;bottom:0;width:44px;cursor:ew-resize}.ch.l{left:0}.ch.r{right:0}
.ch.t::before,.ch.b::before{width:90px;height:10px}
.ch.l::before,.ch.r::before{width:10px;height:90px}
#spot{position:absolute;z-index:15;border-radius:50%;box-shadow:0 0 0 200vmax rgba(5,15,12,.88);pointer-events:none}
#spot.sq{border-radius:18px}
#spot .ring{position:absolute;inset:-14px;border-radius:inherit;border:14px solid transparent;pointer-events:auto;cursor:move}
#spot .ring:hover{border-color:rgba(245,183,0,.35)}
#spot .rs{position:absolute;right:-10px;bottom:-10px;width:40px;height:40px;border-radius:50%;background:var(--lapiz);pointer-events:auto;cursor:nwse-resize;box-shadow:var(--shadow)}
.ov-close{position:absolute;z-index:27;top:76px;left:50%;transform:translateX(-50%);display:flex;gap:6px}

/* Modales y avisos */
#modalRoot{position:fixed;inset:0;z-index:100;display:none;align-items:center;justify-content:center;background:rgba(10,25,20,.5);padding:16px;touch-action:none}
#modalRoot.on{display:flex}
.modal{background:#fff;color:var(--grafito);border-radius:22px;box-shadow:var(--shadow);width:min(520px,100%);max-height:calc(100vh - 32px);overflow:auto;padding:24px;animation:popIn .15s ease-out;touch-action:pan-y}
.modal h2{margin:0 0 10px;font-size:22px}
.modal p{margin:0 0 12px;line-height:1.5;color:var(--grafito-2)}
.modal .acts{display:flex;justify-content:flex-end;gap:10px;margin-top:20px;flex-wrap:wrap}
.mbtn{min-height:52px;padding:0 22px;border-radius:14px;background:var(--tiza-2);font-weight:700;font-size:16px}
.mbtn:hover{background:var(--tiza-3)}
.mbtn.pri{background:var(--pz);color:var(--tiza)}
.mbtn.pri:hover{background:var(--pz-2)}
.mbtn.dan{background:var(--rojo);color:#fff}
.modal input[type=text],.modal select{width:100%;min-height:52px;border-radius:12px;border:2px solid var(--tiza-3);padding:0 14px;font-size:17px;background:#fff;-webkit-user-select:text;user-select:text;touch-action:auto}
.modal input[type=text]:focus{border-color:var(--pz);outline:0}
.opts{display:flex;flex-direction:column;gap:8px}
.opt{display:flex;align-items:center;gap:12px;min-height:56px;padding:8px 14px;border-radius:14px;background:var(--tiza);text-align:left;font-weight:700;border:2px solid transparent}
.opt.on{border-color:var(--pz);background:#E6EEEA}
.opt small{display:block;font-weight:400;color:var(--grafito-3);font-size:13px}
.opt svg.i{color:var(--pz)}
.prog{height:12px;border-radius:6px;background:var(--tiza-2);overflow:hidden;margin-top:12px}
.prog i{display:block;height:100%;width:0;background:var(--lapiz);transition:width .2s}
.modal .set h4{margin:18px 0 8px;font-size:15px;color:var(--grafito-2)}
.modal .set .toggle{background:var(--tiza);color:var(--grafito)}
.modal .set .toggle .sw2{background:var(--tiza-3)}
.modal .set .toggle .sw2::after{background:#fff}
.modal .set .toggle.on .sw2{background:var(--pz)}
.modal .set .toggle.on .sw2::after{background:var(--lapiz)}
.seg{display:flex;background:var(--tiza);border-radius:14px;padding:4px;gap:4px;flex-wrap:wrap}
.seg button{flex:1;min-height:46px;border-radius:11px;font-weight:700;font-size:15px;padding:0 10px}
.seg button.on{background:var(--pz);color:var(--tiza)}
#toasts{position:fixed;left:50%;top:18px;transform:translateX(-50%);z-index:120;display:flex;flex-direction:column;gap:8px;align-items:center;pointer-events:none}
.toast{background:var(--grafito);color:#fff;padding:12px 18px;border-radius:14px;box-shadow:var(--shadow);font-weight:700;font-size:15px;display:flex;gap:14px;align-items:center;pointer-events:none;animation:popIn .15s ease-out;max-width:90vw}
.toast.err{background:var(--rojo)}
.toast button{pointer-events:auto;color:var(--lapiz);font-weight:700;padding:6px 4px}
#dropHint{position:fixed;inset:12px;z-index:90;border:4px dashed var(--lapiz);border-radius:24px;background:rgba(31,64,54,.75);color:var(--tiza);display:none;place-items:center;font-size:28px;font-weight:700;pointer-events:none}
#dropHint.on{display:grid}
</style>
</head>

<script>
'use strict';
/* =========================================================
   Pizarra Siurot — pizarra digital para el aula
   Un solo archivo HTML, sin dependencias (PDF.js solo al importar PDF)
   ========================================================= */
const APP = 'pizarra-siurot', VERSION = 1;
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => [...r.querySelectorAll(s)];
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
const sleep = ms => new Promise(r => setTimeout(r, ms));
const DPR = () => Math.min(window.devicePixelRatio || 1, 2);
function debounce(fn, ms) { let t; const f = (...a) => { clearTimeout(t); t = setTimeout(() => fn(...a), ms); }; f.flush = () => { clearTimeout(t); fn(); }; f.cancel = () => clearTimeout(t); return f; }
function el(tag, attrs = {}, ...kids) {
  const e = document.createElement(tag);
  for (const k in attrs) {
    const v = attrs[k];
    if (k === 'class') e.className = v;
    else if (k === 'html') e.innerHTML = v;
    else if (k.startsWith('on')) e.addEventListener(k.slice(2), v);
    else if (k === 'style' && typeof v === 'object') Object.assign(e.style, v);
    else if (v !== false && v != null) e.setAttribute(k, v === true ? '' : v);
  }
  for (const c of kids.flat()) if (c != null) e.append(c.nodeType ? c : document.createTextNode(c));
  return e;
}

function svgI(name, size) {
  const s = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
  s.setAttribute('viewBox', '0 0 24 24'); s.setAttribute('class', 'i');
  if (size) { s.style.width = s.style.height = size + 'px'; }

  p.setAttribute('d', ICONS[name] || ''); s.append(p); return s;
}
function hydrateIcons(root = document) {
  $$('svg[data-i]', root).forEach(s => {
    s.setAttribute('viewBox', '0 0 24 24');
    if (!s.firstChild) { const p = document.createElementNS('http://www.w3.org/2000/svg', 'path'); s.append(p); }
    s.firstChild.setAttribute('d', ICONS[s.dataset.i] || '');
  });
}

/* ---------- Navegación con el botón Atrás (migas de pan) ---------- */
const Nav = {
  stack: [], ignore: 0, queue: 0,
  push(id, close) {
    this.stack.push({ id, close });
    if (this.ignore) this.queue++; else try { history.pushState({ pz: 1 }, ''); } catch (e) {}
  },
  // Cerrar desde la interfaz: quita la capa y descarta una entrada del historial
  close(id) {
    const i = this.stack.map(x => x.id).lastIndexOf(id); if (i < 0) return;
    const [x] = this.stack.splice(i, 1); x.close();
    this.ignore++; history.back();
  },
  // Cierra la capa id y todo lo que tenga encima
  closeFrom(id) {
    const i = this.stack.map(x => x.id).lastIndexOf(id); if (i < 0) return;
    const gone = this.stack.splice(i); gone.reverse().forEach(x => x.close());
    this.ignore++; history.go(-gone.length);
  },
  has(id) { return this.stack.some(x => x.id === id); },
  onPop() {
    if (this.ignore) { this.ignore--; if (!this.ignore) while (this.queue) { this.queue--; history.pushState({ pz: 1 }, ''); } return; }
    const x = this.stack.pop(); if (x) x.close();
  }
};
window.addEventListener('popstate', () => Nav.onPop());

let modalCount = 0;
function modal({ title, text, body, buttons = [{ label: 'Aceptar', value: true, pri: true }], wide, onOpen, dismiss = true }) {
  return new Promise(resolve => {
    const id = 'modal' + (++modalCount);
    const root = $('#modalRoot');
    const box = el('div', { class: 'modal', role: 'dialog', 'aria-modal': 'true', style: wide ? { width: 'min(720px,100%)' } : {} });
    if (title) box.append(el('h2', {}, title));
    if (text) box.append(el('p', {}, text));
    if (body) box.append(body);
    let result = null, done = false;
    const finish = v => { result = v; Nav.close(id); };
    const acts = el('div', { class: 'acts' });
    buttons.forEach(b => acts.append(el('button', { class: 'mbtn' + (b.pri ? ' pri' : '') + (b.danger ? ' dan' : ''), onclick: () => finish(typeof b.value === 'function' ? b.value() : b.value) }, b.label)));
    if (buttons.length) box.append(acts);
    const wrap = el('div', { style: { display: 'contents' } }, box);
    root.append(wrap); root.classList.add('on');
    const onBg = e => { if (e.target === root && dismiss) finish(null); };
    root.addEventListener('pointerdown', onBg);
    Nav.push(id, () => {
      if (done) return; done = true;
      wrap.remove(); root.removeEventListener('pointerdown', onBg);
      if (!root.children.length) root.classList.remove('on');
      resolve(result);
    });
    box._finish = finish;
    if (onOpen) onOpen(box, finish);
    const inp = box.querySelector('input[type=text]');
    if (inp) setTimeout(() => { inp.focus(); inp.select(); }, 60);
  });
}

/* ---------- IndexedDB ---------- */
const DB = {
  db: null,
  open() {
    if (this.db) return Promise.resolve(this.db);
    return new Promise((res, rej) => {
      const r = indexedDB.open(APP, 1);
      r.onupgradeneeded = () => { const d = r.result; ['docs', 'meta', 'assets', 'kv'].forEach(s => d.objectStoreNames.contains(s) || d.createObjectStore(s)); };
      r.onsuccess = () => { this.db = r.result; res(this.db); };
      r.onerror = () => rej(r.error);
    });
  },
  async tx(store, mode, fn) {
    const d = await this.open();
    return new Promise((res, rej) => {
      const t = d.transaction(store, mode); const s = t.objectStore(store);
      const r = fn(s);
      t.oncomplete = () => res(r && 'result' in r ? r.result : undefined);
      t.onerror = () => rej(t.error); t.onabort = () => rej(t.error);
    });
  },
  get(s, k) { return this.tx(s, 'readonly', st => st.get(k)); },
  put(s, k, v) { return this.tx(s, 'readwrite', st => st.put(v, k)); },
  del(s, k) { return this.tx(s, 'readwrite', st => st.delete(k)); },
  async all(s) {
    const d = await this.open();
    return new Promise((res, rej) => {
      const out = []; const t = d.transaction(s, 'readonly'); const c = t.objectStore(s).openCursor();
      c.onsuccess = () => { const cur = c.result; if (cur) { out.push(cur.value); cur.continue(); } else res(out); };
      c.onerror = () => rej(c.error);
    });
  }
};

const Assets = {
  data: new Map(), img: new Map(), pending: new Map(),
  async add(dataURL) { const id = 'a' + uid(); this.data.set(id, dataURL); await DB.put('assets', id, dataURL).catch(() => {}); return id; },
  async ensure(id) {
    if (this.img.has(id)) return this.img.get(id);
    if (this.pending.has(id)) return this.pending.get(id);
    const p = (async () => {
      let d = this.data.get(id);
      if (!d) { d = await DB.get('assets', id).catch(() => null); if (d) this.data.set(id, d); }
      if (!d) return null;
      const im = new Image(); im.src = d;
      try { await im.decode(); } catch (e) { await new Promise(r => { im.onload = r; im.onerror = r; }); }
      this.img.set(id, im); return im;
    })();
    this.pending.set(id, p); const r = await p; this.pending.delete(id); return r;
  },
  get(id) { const im = this.img.get(id); if (!im) this.ensure(id).then(x => x && requestRender(true)); return im; },
  async dataOf(id) { if (!this.data.has(id)) { const d = await DB.get('assets', id).catch(() => null); if (d) this.data.set(id, d); } return this.data.get(id); }

    rectCorners(o).forEach(([x, y]) => { x0 = Math.min(x0, x); y0 = Math.min(y0, y); x1 = Math.max(x1, x); y1 = Math.max(y1, y); });

}

  for (let i = 0; i < N; i++) {

    const p = pages[i], long = Math.max(p.w, p.h), pw = +(842 * p.w / long).toFixed(2), ph = +(842 * p.h / long).toFixed(2);
    const c = await renderPageCanvas(p, Math.min(scale, 4096 / long));
    const blob = await new Promise(r => c.toBlob(r, 'image/jpeg', .92));
    const bytes = new Uint8Array(await blob.arrayBuffer());
    const pn = 3 + i * 3;
    obj(pn, `<< /Type /Page /Parent 2 0 R /MediaBox [0 0 ${pw} ${ph}] /Resources << /XObject << /Im${i} ${pn + 2} 0 R >> >> /Contents ${pn + 1} 0 R >>`);
    const content = `q ${pw} 0 0 ${ph} 0 0 cm /Im${i} Do Q`;
    obj(pn + 1, `<< /Length ${content.length} >>\nstream\n${content}\nendstream`);
    offs[pn + 2] = len;
    push(`${pn + 2} 0 obj\n<< /Type /XObject /Subtype /Image /Width ${c.width} /Height ${c.height} /ColorSpace /DeviceRGB /BitsPerComponent 8 /Filter /DCTDecode /Length ${bytes.length} >>\nstream\n`);
    push(bytes); push('\nendstream\nendobj\n');
    await sleep(0);
  }
  const xref = len;
  let x = 'xref\n0 ' + (total + 1) + '\n0000000000 65535 f \n';
  for (let k = 1; k <= total; k++) x += String(offs[k]).padStart(10, '0') + ' 00000 n \n';
  push(x + 'trailer\n<< /Size ' + (total + 1) + ' /Root 1 0 R >>\nstartxref\n' + xref + '\n%%EOF\n');

function setupPWA() {

        if (!w || !navigator.serviceWorker.controller) return;
        toast('Hay una versión nueva de la Pizarra', { ms: 15000, action: { label: 'Actualizar', fn: async () => { if (S.doc) { saveSoon.flush(); await saving; } w.postMessage('skipWaiting'); } } });
      };
      if (reg.waiting) offer(reg.waiting);

    let reloading = false;
    navigator.serviceWorker.addEventListener('controllerchange', () => { if (reloading) return; reloading = true; location.reload(); });
  }
  // Abrir .pizarra o PDF desde el gestor de archivos («Abrir con Pizarra»)
  if ('launchQueue' in window) {
    window.launchQueue.setConsumer(async params => {
      if (!params.files || !params.files.length) return;
      const files = await Promise.all(params.files.map(h => h.getFile()));

    toggleRow('Borrar con la palma o el puño', 'Como en los paneles: apoya la mano para borrar.', Settings.palm, v => set('palm', v)),
    el('div', { style: { margin: '8px 0 0' } }, segRow([[50, 'Palma pequeña'], [70, 'Media'], [100, 'Grande']], Settings.palmSize, v => set('palmSize', v))),
    el('div', { style: { height: '8px' } }),
    toggleRow('Si uso lápiz, el dedo solo mueve', 'Evita marcas al apoyar la mano en paneles con lápiz activo.', Settings.penOnly, v => set('penOnly', v)),
    toggleRow('El dedo siempre mueve la vista', 'Útil si solo quieres escribir con el lápiz del panel.', Settings.fingerPan, v => set('fingerPan', v)),
    el('h4', {}, 'Suavizado del trazo'), segRow([[0, 'Nada'], [1, 'Poco'], [2, 'Medio'], [3, 'Mucho']], Settings.smooth, v => set('smooth', v)),
    el('h4', {}, 'Tamaño de las páginas nuevas'), segRow(Object.entries(PAGE_KINDS).map(([k, v]) => [k, v.label]), Settings.pageKind, v => set('pageKind', v)),
  );
  if (hasFSA) {
    box.append(el('h4', {}, 'Carpeta de rotafolios'), el('p', { style: { margin: '0 0 8px' } }, S.folder ? 'Ahora: «' + S.folder.name + '»' + (S.folderOK ? '' : ' (pendiente de permiso)') : 'No hay carpeta. En Chromebook puedes elegir una carpeta de Google Drive.'),
      el('div', { class: 'row' }, el('button', { class: 'mbtn', onclick: () => { box.closest('.modal')._finish(null); setTimeout(chooseFolder, 80); } }, S.folder ? 'Cambiar carpeta' : 'Elegir carpeta'), S.folder ? el('button', { class: 'mbtn', onclick: () => { box.closest('.modal')._finish(null); forgetFolder(); } }, 'Olvidar carpeta') : null));
  }
  box.append(el('h4', {}, 'Calibrar una PDI de proyector'), el('p', { style: { margin: 0 } }, 'La calibración se hace con el programa de la pizarra (Promethean, Smart, Hitachi…). Si el trazo sale desplazado, calibra primero y después abre la Pizarra.'));
  modal({ title: 'Ajustes', body: box, wide: true, buttons: [{ label: 'Hecho', value: true, pri: true }] });
}

/* =========================================================
   Teclado, portapapeles, arrastrar y soltar
   ========================================================= */
function isTyping(e) { const t = e.target; return t && (t.tagName === 'INPUT' || t.tagName === 'TEXTAREA' || t.isContentEditable); }
function setupKeys() {
  document.addEventListener('keydown', e => {
    if (isTyping(e) || !S.doc || $('#board').classList.contains('hidden') || $('#modalRoot').classList.contains('on')) return;
    const k = e.key, ctrl = e.ctrlKey || e.metaKey;
    if (ctrl && k.toLowerCase() === 'z') { e.preventDefault(); e.shiftKey ? redo() : undo(); }
    else if (ctrl && k.toLowerCase() === 'y') { e.preventDefault(); redo(); }
    else if (ctrl && k.toLowerCase() === 'd') { e.preventDefault(); duplicateSel(); }
    else if (ctrl && k.toLowerCase() === 'a') { e.preventDefault(); selectAll(); }
    else if (ctrl && (k.toLowerCase() === 'c' || k.toLowerCase() === 'x')) { const o = selectedObjects(); if (o.length) { S.clipboard = o.map(x => ({ ...x })); if (k.toLowerCase() === 'x') deleteSel(); } }
    else if (ctrl && k.toLowerCase() === 's') { e.preventDefault(); saveSoon.flush(); toast('Guardado'); }
    else if (ctrl) return;
    else if (k === 'Delete' || k === 'Backspace') { if (S.sel.size) { e.preventDefault(); deleteSel(); } }
    else if (k === 'Escape') { if (popEl) closePopover(); else if (panelEl) Nav.close('pages'); else if (S.sel.size) clearSel(); }
    else if (k === 'PageDown' || (k === 'ArrowRight' && !S.sel.size)) { e.preventDefault(); S.pi < S.doc.pages.length - 1 && goPage(S.pi + 1); }
    else if (k === 'PageUp' || (k === 'ArrowLeft' && !S.sel.size)) { e.preventDefault(); S.pi > 0 && goPage(S.pi - 1); }
    else if (k.startsWith('Arrow') && S.sel.size) {
      e.preventDefault(); const d = e.shiftKey ? 20 : 3, dx = k === 'ArrowLeft' ? -d : k === 'ArrowRight' ? d : 0, dy = k === 'ArrowUp' ? -d : k === 'ArrowDown' ? d : 0;
      const ids = S.sel; setObjects(page().objects.map(o => ids.has(o.id) && !o.lock ? transformObj(o, mTranslate(dx, dy)) : o)); positionSelbar();
    }
    else if (k === ' ') { if (!spaceDown) { spaceDown = true; stageEl().style.cursor = 'grab'; } e.preventDefault(); }
    else if (k === '+' || k === '=') zoomAt(1.2); else if (k === '-') zoomAt(1 / 1.2); else if (k === '0') fitView();
    else { const map = { v: 'select', h: 'hand', p: 'pen', f: 'hl', e: 'eraser', s: 'shape', t: 'text', l: 'laser' }; if (map[k.toLowerCase()]) setTool(map[k.toLowerCase()]); }
  });
  document.addEventListener('keyup', e => { if (e.key === ' ') { spaceDown = false; stageEl().style.cursor = ''; } });
  document.addEventListener('paste', e => {
    if (isTyping(e) || !S.doc || $('#board').classList.contains('hidden')) return;
    const files = [...(e.clipboardData && e.clipboardData.files || [])].filter(f => f.type.startsWith('image/'));
    if (files.length) { e.preventDefault(); insertImages(files); return; }
    if (S.clipboard && S.clipboard.length) {
      e.preventDefault(); const d = 30; const copies = S.clipboard.map(o => ({ ...transformObj(o, mTranslate(d, d)), id: uid(), lock: undefined }));
      S.clipboard = copies; setObjects([...page().objects, ...copies]); setTool('select'); S.sel = new Set(copies.map(o => o.id)); showSelbar();
    }
  });
  let dragN = 0; const hint = $('#dropHint');
  window.addEventListener('dragenter', e => { if ([...(e.dataTransfer.types || [])].includes('Files')) { dragN++; hint.classList.add('on'); } });
  window.addEventListener('dragleave', () => { dragN = Math.max(0, dragN - 1); if (!dragN) hint.classList.remove('on'); });
  window.addEventListener('dragover', e => e.preventDefault());
  window.addEventListener('drop', e => { e.preventDefault(); dragN = 0; hint.classList.remove('on'); if (e.dataTransfer.files.length) handleFiles(e.dataTransfer.files); });
}

/* =========================================================
   Arranque
   ========================================================= */
function toggleFull() {
  const d = document;
  if (!d.fullscreenElement) (d.documentElement.requestFullscreen || d.documentElement.webkitRequestFullscreen || (() => Promise.reject())).call(d.documentElement).catch(() => toast('Este equipo no permite la pantalla completa', { err: true }));
  else (d.exitFullscreen || d.webkitExitFullscreen).call(d);
}
function saveToolPrefs() { try { localStorage.setItem(APP + '-tools', JSON.stringify(S.tools)); } catch (e) {} }
function loadToolPrefs() { try { const t = JSON.parse(localStorage.getItem(APP + '-tools')); if (t) for (const k in S.tools) if (t[k]) Object.assign(S.tools[k], t[k]); } catch (e) {} }
async function init() {
  hydrateIcons(); applySettings(); loadToolPrefs();
  setupCanvases(); setupInput(); setupKeys();
  const on = (id, fn) => $(id).addEventListener('click', fn);
  $$('#dock [data-tool]').forEach(b => b.addEventListener('click', () => { const t = b.dataset.tool; if (S.tool === t) openToolPop(t, b); else { closePopover(); setTool(t); } }));
  on('#bMenu', e => openMenuPop(e.currentTarget));
  on('#bMore', e => { const b = e.currentTarget; if ((S.tool === 'laser' || S.tool === 'hand') && !popEl) openToolPop(S.tool, b); else openMorePop(b); });
  on('#bColor', e => openColorPop(e.currentTarget));
  on('#bUndo', undo); on('#bRedo', redo);
  on('#bDockMin', () => toggleDock());
  on('#bFit', () => fitView(true));
  on('#bPrev', () => S.pi > 0 && goPage(S.pi - 1));
  on('#bNext', () => S.pi < S.doc.pages.length - 1 ? goPage(S.pi + 1) : addPage());
  on('#pageLbl', togglePagesPanel);
  on('#hInstall', () => Install.run());
  on('#hNew', newDocFlow); on('#hImport', () => pickFiles('application/pdf,.pdf,image/*'));
  on('#hOpen', () => pickFiles('.pizarra,application/json'));
  on('#hFolder', () => { if (S.folder && !S.folderOK) reconnectFolder(); else if (S.folder) openSettings(); else chooseFolder(); });
  on('#hSettings', openSettings);
  const flush = () => { saveToolPrefs(); if (S.doc) saveSoon.flush(); };
  window.addEventListener('pagehide', flush);
  document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'hidden') flush(); });
  if (document.fonts) { document.fonts.ready.then(() => { cache = new WeakMap(); thumbCache.clear(); requestRender(true); }); document.fonts.addEventListener && document.fonts.addEventListener('loadingdone', () => { cache = new WeakMap(); requestRender(true); }); }
  if (navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(() => {});
  setupPWA();
  await restoreFolder();
  renderLibrary();
}
init();
</script>
